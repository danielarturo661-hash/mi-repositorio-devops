version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Instalando dependencias"
      - pip install -r app/requirements.txt

  build:
    commands:
      - echo "Construyendo la aplicación"
      - docker build -t mi-app ./app

  post_build:
    commands:
      - echo "Build completado correctamente"

artifacts:
  files:
    - '**/*'